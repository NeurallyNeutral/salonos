name: SalonOS release gates
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:handoff
      - run: npm run test:safety
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run demo:scenario
      - run: npm run test:recovery
      - run: npm run demo:v2
      - run: npm run test:performance
      - run: npm run discovery:dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-qa-evidence
          path: |
            artifacts/
            playwright-report/
          retention-days: 7
