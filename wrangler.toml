name = "salonos-handoff"
main = "dist/worker.mjs"
compatibility_date = "2026-07-30"

[build]
command = "npm run build"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "salonos-local"
# Placeholder allows local work. MUST replace with the ID from your OWN D1 database before remote deployment.
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[vars]
APP_BASE_URL = "http://localhost:8787"
ENVIRONMENT = "development"
